apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: cert-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager-chart
  serviceAccountName: flux
  install:
    timeout: 10m
    crds: Create
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    timeout: 10m
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  uninstall:
    keepHistory: false
  values:
    crds:
      enabled: true
      keep: false
    # Single-node dev cluster: no High-Availability replicas
    replicaCount: 1
    prometheus:
      enabled: false
