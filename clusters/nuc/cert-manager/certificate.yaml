apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-int-linuxalert-org
  namespace: cert-manager
spec:
  secretName: letsencrypt-prod-gw
  duration: 2160h0m0s # 90d
  renewBefore: 360h0m0s # 15d
  issuerRef:
    name: letsencrypt-prod-gw
    kind: ClusterIssuer
  commonName: "*.int.linuxalert.org"
  dnsNames:
  - "*.int.linuxalert.org"
