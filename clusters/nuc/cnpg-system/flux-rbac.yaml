# Tenant identity for the cnpg-system namespace. The Flux multitenant lockdown
# (FluxInstance spec.cluster.multitenant) makes controllers impersonate the
# tenant ServiceAccount; we grant it cluster-admin so HelmRelease apply works.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux
  namespace: cnpg-system
  labels:
    app.kubernetes.io/part-of: cnpg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-cnpg-system-cluster-admin
  labels:
    app.kubernetes.io/part-of: cnpg-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: flux
    namespace: cnpg-system
