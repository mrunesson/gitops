apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-system
  namespace: cnpg-system
  labels:
    app.kubernetes.io/part-of: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: '0.29.*'
      sourceRef:
        kind: HelmRepository
        name: cnpg-chart
      interval: 5m
  releaseName: cnpg-system
  serviceAccountName: flux
