apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: keycloak
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: keycloak-chart
  serviceAccountName: flux
  install:
    timeout: 10m
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    timeout: 10m
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  uninstall:
    keepHistory: false
  values:
    # Single-node dev cluster: no High-Availability replicas
    replicas: 1
    http:
      relativePath: "/"
    database:
      vendor: postgres
      hostname: keycloak-db-rw
      port: 5432
      database: keycloak
      username: keycloak
      existingSecret: keycloak-db-app
      existingSecretKey: password
    proxy:
      enabled: true
      mode: xforwarded
      http:
        enabled: true
    command:
      - "/opt/keycloak/bin/kc.sh"
      - "start"
      - "--http-port=8080"
      - "--hostname-strict=false"
    extraEnv: |
      - name: KC_HOSTNAME
        value: "https://keycloak.int.linuxalert.org"
      - name: KC_HOSTNAME_STRICT
        value: "false"
    ingress:
      enabled: true
      ingressClassName: traefik
      servicePort: http
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      rules:
        - host: keycloak.int.linuxalert.org
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - keycloak.int.linuxalert.org
          secretName: keycloak.int.linuxalert.org-tls
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 768Mi
