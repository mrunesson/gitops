# Tenant identity for the keycloak namespace. The Flux multitenant lockdown
# (FluxInstance spec.cluster.multitenant) makes controllers impersonate the
# tenant ServiceAccount; we grant it cluster-admin so HelmRelease apply works.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: keycloak
