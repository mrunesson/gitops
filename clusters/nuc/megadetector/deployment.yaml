apiVersion: apps/v1
kind: Deployment
metadata:
  name: megadetector-service
  labels:
    app.kubernetes.io/name: megadetector-service
    app.kubernetes.io/component: detection-api
    app.kubernetes.io/part-of: megadetector
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: megadetector-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: megadetector-service
        app.kubernetes.io/component: detection-api
        app.kubernetes.io/part-of: megadetector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: megadetector-service
      containers:
        - name: megadetector-service
          image: ccr.ctrl-c.liu.se/runeson/megadetector-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL_PATH
              value: /model/md_v1000.0.0-redwood.pt
            - name: YOLO_CONFIG_DIR
              value: /tmp
            - name: MPLCONFIGDIR
              value: /tmp
            - name: UV_CACHE_DIR
              value: /tmp/.cache
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: model-volume
              mountPath: /model
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-volume
          image:
            reference: ccr.ctrl-c.liu.se/runeson/megadetector-model:v1000.0.0-redwood
            pullPolicy: IfNotPresent
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
