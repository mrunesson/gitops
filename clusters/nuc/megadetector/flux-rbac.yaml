# Tenant identity for the keycloak namespace. The Flux multitenant lockdown
# (FluxInstance spec.cluster.multitenant) makes controllers impersonate the
# tenant ServiceAccount; we grant it admin in this namespace so HelmRelease apply works.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux
  labels:
    app.kubernetes.io/part-of: megadetector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-admin
  labels:
    app.kubernetes.io/part-of: megadetector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: flux
    namespace: megadetector
